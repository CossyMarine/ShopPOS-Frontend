<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ============ Favicons / PWA icons ============ -->
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The web manifest link is injected automatically by vite-plugin-pwa -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF5722" />

    <!-- iOS PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CHEMALUK" />

    <!-- ============ Primary SEO ============ -->
    <title>Babylon Supermarket | Fresh Groceries & Everyday Essentials</title>
    <meta
      name="description"
      content="Babylon Supermarket offers fresh produce, groceries, beverages, household goods and everyday essentials at great prices. Shop in store with fast checkout and M-Pesa payments."
    />
    <meta
      name="keywords"
      content="Babylon Supermarket, supermarket, grocery store, fresh produce, groceries Kenya, household goods, beverages, bakery, M-Pesa payments, supermarket near me, affordable groceries"
    />
    <meta name="author" content="Babylon Supermarket" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <link rel="canonical" href="https://babylonsupermarket.com/" />

    <!-- ============ Open Graph (Facebook, WhatsApp, LinkedIn) ============ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Babylon Supermarket" />
    <meta property="og:title" content="Babylon Supermarket | Fresh Groceries & Everyday Essentials" />
    <meta
      property="og:description"
      content="Fresh produce, groceries, beverages and household essentials at great prices. Visit Babylon Supermarket today."
    />
    <meta property="og:image" content="https://babylonsupermarket.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://babylonsupermarket.com/" />
    <meta property="og:locale" content="en_KE" />

    <!-- ============ Twitter Card ============ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Babylon Supermarket | Fresh Groceries & Everyday Essentials" />
    <meta
      name="twitter:description"
      content="Fresh produce, groceries, beverages and household essentials at great prices. Visit Babylon Supermarket today."
    />
    <meta name="twitter:image" content="https://babylonsupermarket.com/og-image.jpg" />

    <!-- ============ Fonts & Icons ============ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ============ Structured Data (Supermarket) ============ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GroceryStore",
        "name": "Babylon Supermarket",
        "image": "https://babylonsupermarket.com/og-image.jpg",
        "url": "https://babylonsupermarket.com/",
        "priceRange": "$$",
        "currenciesAccepted": "KES",
        "paymentAccepted": "Cash, M-Pesa",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Your Street Address",
          "addressLocality": "Your City",
          "addressCountry": "KE"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
            "opens": "08:00",
            "closes": "21:00"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
